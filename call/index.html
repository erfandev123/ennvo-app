<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#07131f" />
    <meta name="format-detection" content="telephone=no" />
    <title>Ennvo Call</title>
  </head>
  <body>
    <div id="call" class="call is-incoming">
      <div id="backdrop" class="backdrop" aria-hidden="true"></div>

      <header class="topbar">
        <span class="brand"><span class="brand-dot"></span> Ennvo</span>
        <span id="kind" class="kind">Secure call</span>
      </header>

      <main class="stage">
        <video id="remote" class="remote" autoplay playsinline muted></video>

        <section id="identity" class="identity">
          <div class="avatar-wrap">
            <span class="avatar-ring"></span>
            <img id="avatar" class="avatar" alt="" />
            <span id="avatar-fallback" class="avatar-fallback" hidden></span>
          </div>
          <div class="who">
            <h1 id="name" class="name">Ennvo Call</h1>
            <p id="status" class="status">Incoming call…</p>
            <p id="hint" class="hint" hidden></p>
          </div>
        </section>

        <div id="local-wrap" class="local-wrap" hidden>
          <video id="local" class="local" autoplay playsinline muted></video>
          <button id="flip" class="flip" type="button" aria-label="Switch camera" title="Switch camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
              <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5" />
              <path d="m18 22 3-3-3-3" />
              <path d="m6 2-3 3 3 3" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <audio id="remote-audio" autoplay></audio>
      </main>

      <footer class="dock">
        <div id="incoming-actions" class="actions">
          <div class="action">
            <button id="decline" class="round danger" type="button" aria-label="Decline call">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" />
                <line x1="22" y1="2" x2="2" y2="22" />
              </svg>
            </button>
            <span class="label">Decline</span>
          </div>

          <div class="action">
            <button id="accept" class="round accept" type="button" aria-label="Accept call">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
              </svg>
            </button>
            <span class="label">Accept</span>
          </div>
        </div>

        <div id="active-actions" class="actions controls" hidden>
          <div class="action">
            <button id="mute" class="round glass" type="button" aria-label="Mute">
              <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3" />
                <path d="M5 10a7 7 0 0 0 14 0" />
                <line x1="12" y1="19" x2="12" y2="22" />
                <line x1="8" y1="22" x2="16" y2="22" />
              </svg>
              <svg class="icon-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                <line x1="2" y1="2" x2="22" y2="22" />
                <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2" />
                <path d="M5 10v2a7 7 0 0 0 12 5" />
                <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33" />
                <path d="M9 9v3a3 3 0 0 0 5.12 2.12" />
                <line x1="12" y1="19" x2="12" y2="22" />
                <line x1="8" y1="22" x2="16" y2="22" />
              </svg>
            </button>
            <span class="label">Mute</span>
          </div>

          <div class="action">
            <button id="speaker" class="round glass" type="button" aria-label="Speaker">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path class="wave" d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path class="wave" d="M19.07 4.93a10 10 0 0 1 0 14.14" />
              </svg>
            </button>
            <span class="label">Speaker</span>
          </div>

          <div id="camera-action" class="action">
            <button id="camera" class="round glass" type="button" aria-label="Turn camera off">
              <svg class="icon-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m22 8-6 4 6 4V8Z" />
                <rect x="2" y="6" width="14" height="12" rx="2" />
              </svg>
              <svg class="icon-cam-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.248-3.062A.5.5 0 0 1 22 7.87v8.26a.5.5 0 0 1-.752.423L16 14" />
                <path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2" />
                <line x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </button>
            <span class="label">Camera</span>
          </div>

          <div class="action">
            <button id="end" class="round hangup" type="button" aria-label="End call">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" />
                <line x1="22" y1="2" x2="2" y2="22" />
              </svg>
            </button>
            <span class="label">End</span>
          </div>
        </div>

        <button id="return-app" class="return-app" type="button" hidden>Return to Ennvo</button>
      </footer>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
