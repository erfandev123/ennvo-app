                      n.flags |= Notification.FLAG_INSISTENT;
                      ((NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE)).notify(CALL_ID, n);
                  }).start();
              }

              private static PendingIntent callActivity(Context ctx, int code, String act, String callId, String name, String type) {
                  Intent i = new Intent(ctx, MainActivity.class).setAction("app.CALL." + act)
                      .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      .putExtra("call_action", act).putExtra("call_id", callId).putExtra("call_name", name)
                      .putExtra("call_type", type == null ? "voice" : type).putExtra("call_screen", true);
                  return PendingIntent.getActivity(ctx, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              // Likes, comments and follows.
              static void showActivity(final Context ctx, final String text, final String avatarUrl) {
                  if (foreground) return;
                  String mode = ctx.getSharedPreferences("app", Context.MODE_PRIVATE).getString("notif_mode", "on");
                  if ("off".equals(mode)) return;
                  final boolean secret = "secret".equals(mode);
                  channels(ctx);
                  new Thread(() -> {
                      Bitmap av = secret ? null : loadAvatar(avatarUrl);
                      NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, ACT_CH)
                          .setSmallIcon(smallIcon(ctx))
                          .setColor(ACCENT)
                          .setContentTitle(APP)
                          .setContentText(secret ? "You have a new notification" : (text == null ? "" : text))
                          .setCategory(NotificationCompat.CATEGORY_SOCIAL)
                          .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                          .setAutoCancel(true)
                          .setContentIntent(open(ctx, 8001, "__activity__", ""));
                      if (av != null) b.setLargeIcon(av);
                      ((NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE))
                          .notify((int) (System.currentTimeMillis() % 100000) + 20000, b.build());
                  }).start();
              }

              static void cancelCall(Context ctx) {
                  ((NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE)).cancel(CALL_ID);
              }

              static void saveToken(Context ctx, String token) {
                  ctx.getSharedPreferences("app", Context.MODE_PRIVATE).edit().putString("fcm", token).apply();
                  MainActivity a = activity;
                  if (a != null) a.runJs("window.onFcmToken&&window.onFcmToken(" + JSONObject.quote(token) + ")");
              }

              static synchronized void queue(Context ctx, String c, String t, String n) {
                  try {
                      SharedPreferences sp = ctx.getSharedPreferences("app", Context.MODE_PRIVATE);
                      JSONArray a = new JSONArray(sp.getString("pending", "[]"));
                      a.put(new JSONObject().put("c", c).put("t", t).put("n", n));
                      sp.edit().putString("pending", a.toString()).apply();
                  } catch (Exception ignored) { }
              }

              static synchronized String takePending(Context ctx) {
                  SharedPreferences sp = ctx.getSharedPreferences("app", Context.MODE_PRIVATE);
                  String s = sp.getString("pending", "[]");
                  sp.edit().remove("pending").apply();
                  return s;
              }

              private static int smallIcon(Context ctx) {
                  int r = ctx.getResources().getIdentifier("ic_stat_notify", "drawable", ctx.getPackageName());
                  return r != 0 ? r : android.R.drawable.stat_notify_chat;
              }

              private static PendingIntent open(Context ctx, int code, String convId, String name) {
                  Intent i = new Intent(ctx, MainActivity.class).setAction("app.OPEN")
                      .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      .putExtra("open_conv", convId == null ? "" : convId).putExtra("open_name", name == null ? "" : name);
                  return PendingIntent.getActivity(ctx, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static Bitmap loadAvatar(String u) {
                  if (u == null || !u.startsWith("http")) return null;
                  try {
                      HttpURLConnection h = (HttpURLConnection) new URL(u).openConnection();
                      h.setConnectTimeout(4000);
                      h.setReadTimeout(4000);
                      InputStream in = h.getInputStream();
                      Bitmap src = BitmapFactory.decodeStream(in);
                      in.close();
                      if (src == null) return null;
                      int s = Math.min(src.getWidth(), src.getHeight());
                      Rect from = new Rect((src.getWidth() - s) / 2, (src.getHeight() - s) / 2, (src.getWidth() + s) / 2, (src.getHeight() + s) / 2);
                      Bitmap out = Bitmap.createBitmap(128, 128, Bitmap.Config.ARGB_8888);
                      Canvas cv = new Canvas(out);
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                      cv.drawCircle(64, 64, 64, p);
                      p.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.SRC_IN));
                      cv.drawBitmap(src, from, new Rect(0, 0, 128, 128), p);
                      return out;
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
