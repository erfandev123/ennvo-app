              private PictureInPictureParams pipParams() {
                  float r = Math.max(0.42f, Math.min(2.39f, (float) pipW / (float) Math.max(1, pipH)));
                  PictureInPictureParams.Builder b = new PictureInPictureParams.Builder()
                      .setAspectRatio(new Rational(Math.round(r * 100f), 100));
                  if (Build.VERSION.SDK_INT >= 31) b.setAutoEnterEnabled(pipOn);
                  return b.build();
              }

              private void setProx(boolean on) {
                  try {
                      if (prox != null && prox.isHeld()) prox.release();
                      prox = null;
                      if (!on) return;
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (pm != null && pm.isWakeLockLevelSupported(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK)) {
                          prox = pm.newWakeLock(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK, "app:proximity");
                          prox.acquire(3600000L);
                      }
                  } catch (Exception ignored) { }
              }

              // Opens any scheme with the system. Without this, tel:/mailto:/sms:/whatsapp: taps died silently.
              void openExternal(String url) {
                  if (url == null) return;
                  final String u = url.trim();
                  if (u.isEmpty()) return;

                  if (u.startsWith("intent:")) {
                      try {
                          Intent i = Intent.parseUri(u, Intent.URI_INTENT_SCHEME);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return;
                      } catch (Exception e) {
                          String pkg = null;
                          try { pkg = Intent.parseUri(u, Intent.URI_INTENT_SCHEME).getPackage(); } catch (Exception ignored) { }
                          if (pkg != null) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + pkg))
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                                  return;
                              } catch (Exception ignored) { }
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://" + u.substring("intent://".length())))
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                          } catch (Exception ignored) { }
                          return;
                      }
                  }

                  // Never bounce an Ennvo link back into the system browser.
                  if (u.startsWith("http://localhost") || u.startsWith("https://localhost")) {
                      runJs("window.__ennvoOpenLink&&window.__ennvoOpenLink(" + JSONObject.quote(u) + ")");
                      return;
                  }

                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      return;
                  } catch (Exception ignored) { }

                  // Fallbacks when no dialer / messenger / mail app is installed.
                  try {
                      if (u.startsWith("tel:")) {
                          startActivity(new Intent(Intent.ACTION_DIAL, Uri.parse(u)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                      } else if (u.startsWith("mailto:")) {
                          startActivity(new Intent(Intent.ACTION_SENDTO, Uri.parse(u)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                      }
                  } catch (Exception ignored) { }
              }

              // "Share to this app": copy shared files into the cache so the web app can read them, then tell the page.
              private void handleIntent(final Intent it) {
                  if (it == null) return;
                  try {
                      // Tapping a message notification opens that chat; tapping Answer or the call screen opens the call.
                      String oc = it.getStringExtra("open_conv");
                      String on = it.getStringExtra("open_name");
                      boolean isActivity = "__activity__".equals(oc);
                      if ((oc != null && !oc.isEmpty()) || (on != null && !on.isEmpty())) {
                          pendingOpen = new JSONObject()
                              .put("c", isActivity ? "" : (oc == null ? "" : oc))
                              .put("n", on == null ? "" : on)
                              .put("type", isActivity ? "activity" : "chat")
                              .toString();
                          it.removeExtra("open_conv");
                          it.removeExtra("open_name");
                          runJs("window.onNativeOpen&&window.onNativeOpen()");
                      }
                      String ca = it.getStringExtra("call_action");
                      if (ca != null) {
                          pendingCall = new JSONObject().put("a", ca).put("id", it.getStringExtra("call_id"))
                              .put("name", it.getStringExtra("call_name")).put("type", it.getStringExtra("call_type")).toString();
                          if (it.getBooleanExtra("call_screen", false) && Build.VERSION.SDK_INT >= 27) {
                              setShowWhenLocked(true);
                              setTurnScreenOn(true);
                          }
                          it.removeExtra("call_action");
                          Notifier.cancelCall(this);
                          runJs("window.onNativeCallAction&&window.onNativeCallAction()");
                      }
                  } catch (Exception ignored) { }

                  // ennvo://user/x and https://ennvo.vercel.app/... : route inside the app, never to the browser.
                  try {
                      if (Intent.ACTION_VIEW.equals(it.getAction()) && it.getData() != null) {
                          String raw = it.getData().toString();
                          it.setData(null);
                          if (raw != null && !raw.isEmpty()
                              && !raw.startsWith("http://localhost") && !raw.startsWith("https://localhost")) {
                              runJs("window.__ennvoOpenLink&&window.__ennvoOpenLink(" + JSONObject.quote(raw) + ")");
                          }
                      }
                  } catch (Exception ignored) { }

                  String a = it.getAction();
                  if (!Intent.ACTION_SEND.equals(a) && !Intent.ACTION_SEND_MULTIPLE.equals(a)) return;
                  final boolean multi = Intent.ACTION_SEND_MULTIPLE.equals(a);
                  new Thread(() -> {
                      try {
                          JSONObject o = new JSONObject();
                          JSONArray files = new JSONArray();
                          String text = it.getStringExtra(Intent.EXTRA_TEXT);
                          if (text != null) o.put("text", text);
                          List<Uri> uris = new ArrayList<>();
                          if (multi) {
                              ArrayList<Uri> l = it.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                              if (l != null) uris.addAll(l);
                          } else {
                              Uri single = it.getParcelableExtra(Intent.EXTRA_STREAM);
                              if (single != null) uris.add(single);
                          }
                          File dir = new File(getCacheDir(), "shared");
                          dir.mkdirs();
                          int n = 0;
                          for (Uri u : uris) {
                              if (n >= 10) break;
                              n++;
                              String mime = getContentResolver().getType(u);
                              String ext = mime == null ? null : MimeTypeMap.getSingleton().getExtensionFromMimeType(mime);
                              File f = new File(dir, "share_" + System.currentTimeMillis() + "_" + n + (ext == null ? "" : "." + ext));
                              try (InputStream in = getContentResolver().openInputStream(u); OutputStream out = new FileOutputStream(f)) {
                                  byte[] buf = new byte[65536];
                                  int len;
                                  while (in != null && (len = in.read(buf)) > 0) out.write(buf, 0, len);
                              }
                              files.put(new JSONObject().put("url", "/_capacitor_file_" + f.getAbsolutePath())
                                  .put("mime", mime == null ? "" : mime).put("name", f.getName()));
                          }
                          o.put("files", files);
                          pendingShare = o.toString();
                          runJs("window.onShareReceived&&window.onShareReceived()");
                      } catch (Exception ignored) { }
                  }).start();
              }

              private void applyBars() {
                  Window win = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(win, false);
                  // The bars are always transparent. The window color only shows behind a bar that is "show".
                  if (sColor != lastWinBg) {
                      win.setBackgroundDrawable(new ColorDrawable(sColor));
                      lastWinBg = sColor;
                  }
                  win.setStatusBarColor(Color.TRANSPARENT);
                  win.setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= 29) win.setNavigationBarContrastEnforced(false);
                  if (Build.VERSION.SDK_INT >= 28) {
                      // Draw into the camera cut-out on every edge, so no black strip is left there. Only changed when needed (it forces a relayout).
                      int mode = Build.VERSION.SDK_INT >= 30
                          ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                          : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      if (mode != lastCutout) {
                          WindowManager.LayoutParams p = win.getAttributes();
                          p.layoutInDisplayCutoutMode = mode;
                          win.setAttributes(p);
                          lastCutout = mode;
                      }
                  }
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(win, win.getDecorView());
                  c.setAppearanceLightStatusBars(light);
                  c.setAppearanceLightNavigationBars(light);
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  if (STATUS.equals("hide")) c.hide(WindowInsetsCompat.Type.statusBars()); else c.show(WindowInsetsCompat.Type.statusBars());
                  if (NAV.equals("hide")) c.hide(WindowInsetsCompat.Type.navigationBars()); else c.show(WindowInsetsCompat.Type.navigationBars());
              }

