                  if (t == null || t.toString().trim().length() == 0) return;
                  final String text = t.toString().trim();
                  final PendingResult pr = goAsync();
                  new Thread(() -> {
                      try { Notifier.handleReply(ctx, id, text); } finally { pr.finish(); }
                  }).start();
              }
          }
