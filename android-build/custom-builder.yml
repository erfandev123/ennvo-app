          // One place that builds every notification: bridge calls from the web app and FCM pushes.
          public class Notifier {
              static volatile boolean foreground = false;
              static volatile MainActivity activity = null;
              static final String MSG_CH = "app_messages";
              static final String CALL_CH = "app_calls";
              static final String ACT_CH = "app_activity";
              static final int CALL_ID = 9001;
              static final int SECRET_ID = 9003;
              // Cloud Function that lets a notification reply or decline work while the app is closed.
              static final String PUSH_API = "${e.PUSH_API}";
              static final String APP = ${JSON.stringify(e.APP_NAME)};
              private static long lastSecret = 0;
              static final int ACCENT = Color.parseColor("${accent}");
              private static final Map<Integer, Conv> convs = new HashMap<>();
              private static String lastKey = "";
              private static long lastTime = 0;

              static class Msg {
                  final String text;
                  final long ts = System.currentTimeMillis();
                  final boolean mine;
                  Msg(String t, boolean m) { text = t; mine = m; }
              }

              static class Conv {
                  String title = "";
                  String convId = "";
                  Bitmap avatar;
                  final List<Msg> msgs = new ArrayList<>();
              }

              static void channels(Context ctx) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  NotificationChannel m = new NotificationChannel(MSG_CH, "Messages", NotificationManager.IMPORTANCE_HIGH);
                  m.enableVibration(true);
                  m.setVibrationPattern(new long[]{0, 120, 80, 120});
                  nm.createNotificationChannel(m);
                  NotificationChannel c = new NotificationChannel(CALL_CH, "Calls", NotificationManager.IMPORTANCE_HIGH);
                  AudioAttributes aa = new AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
                  c.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), aa);
                  c.enableVibration(true);
                  c.setVibrationPattern(new long[]{0, 800, 600, 800});
                  c.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  nm.createNotificationChannel(c);
                  nm.createNotificationChannel(new NotificationChannel(ACT_CH, "Activity", NotificationManager.IMPORTANCE_DEFAULT));
              }

              // Lowercase letters and digits only, so "Sam" and "Sam (emoji)" match.
              private static String norm(String s) {
                  StringBuilder b = new StringBuilder();
                  if (s != null) {
                      for (int i = 0; i < s.length(); i++) {
                          char ch = s.charAt(i);
                          if (Character.isLetterOrDigit(ch)) b.append(Character.toLowerCase(ch));
                      }
                  }
                  return b.toString();
              }

              // Drops trailing emoji and spaces from a title like "Sam (emoji)".
              private static String clean(String s) {
                  int last = -1;
                  for (int i = 0; i < s.length(); i++) if (Character.isLetterOrDigit(s.charAt(i))) last = i;
                  return last < 0 ? s : s.substring(0, last + 1);
              }

              static void showMessage(final Context ctx, String title, String body, final String avatarUrl, String convId) {
                  if (foreground) return;
                  String mode = ctx.getSharedPreferences("app", Context.MODE_PRIVATE).getString("notif_mode", "on");
                  if ("off".equals(mode)) return;
                  if ("secret".equals(mode)) { showSecret(ctx); return; }
                  final String t = title == null ? "" : title;
                  final String b = body == null ? "" : body;
                  final String cid = convId == null ? "" : convId;
                  final int id = ("c:" + norm(t)).hashCode();
                  final String key = norm(t) + "|" + norm(b);
                  synchronized (Notifier.class) {
                      long now = System.currentTimeMillis();
                      if (key.equals(lastKey) && now - lastTime < 15000) {
                          // Same message from the web app and from FCM: show it once, but keep the conversation id for replies.
                          Conv dup = convs.get(id);
                          if (dup != null && dup.convId.isEmpty() && !cid.isEmpty()) {
                              dup.convId = cid;
                              repost(ctx, id, false);
                          }
                          return;
                      }
                      lastKey = key;
                      lastTime = now;
                  }
                  new Thread(() -> {
                      Bitmap av = loadAvatar(avatarUrl);
                      synchronized (Notifier.class) {
                          Conv c = convs.get(id);
                          if (c == null) { c = new Conv(); convs.put(id, c); }
                          c.title = clean(t);
                          if (!cid.isEmpty()) c.convId = cid;
                          if (av != null) c.avatar = av;
                          c.msgs.add(new Msg(b, false));
                          while (c.msgs.size() > 8) c.msgs.remove(0);
                      }
                      repost(ctx, id, true);
                  }).start();
              }

              // Secret mode: no name, no text, no picture. Just the app name.
              private static void showSecret(Context ctx) {
                  synchronized (Notifier.class) {
                      long now = System.currentTimeMillis();
                      if (now - lastSecret < 4000) return;
                      lastSecret = now;
                  }
                  channels(ctx);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, MSG_CH)
                      .setSmallIcon(smallIcon(ctx))
                      .setColor(ACCENT)
                      .setContentTitle(APP)
                      .setContentText("You have a new message")
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setAutoCancel(true)
                      .setDefaults(NotificationCompat.DEFAULT_SOUND)
                      .setContentIntent(open(ctx, SECRET_ID, "", ""));
                  ((NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE)).notify(SECRET_ID, b.build());
              }

              static synchronized void repost(Context ctx, int id, boolean alert) {
                  Conv c = convs.get(id);
                  if (c == null || c.msgs.isEmpty()) return;
                  channels(ctx);
                  Person me = new Person.Builder().setName("You").build();
                  String shortcutId = "conv_" + id;
                  Person.Builder pb = new Person.Builder().setName(c.title).setKey(shortcutId).setImportant(true);
                  if (c.avatar != null) pb.setIcon(IconCompat.createWithBitmap(c.avatar));
                  Person other = pb.build();
                  // A conversation shortcut makes Android show the sender's picture with the app icon badge, like WhatsApp.
                  try {
                      Intent si = new Intent(ctx, MainActivity.class).setAction("app.OPEN")
                          .putExtra("open_conv", c.convId).putExtra("open_name", c.title);
                      ShortcutInfoCompat.Builder sb = new ShortcutInfoCompat.Builder(ctx, shortcutId)
                          .setLongLived(true).setShortLabel(c.title).setIntent(si).setPerson(other);
                      if (c.avatar != null) sb.setIcon(IconCompat.createWithBitmap(c.avatar));
                      ShortcutManagerCompat.pushDynamicShortcut(ctx, sb.build());
                  } catch (Exception ignored) { }
                  NotificationCompat.MessagingStyle style = new NotificationCompat.MessagingStyle(me);
                  for (Msg m : c.msgs) style.addMessage(m.text, m.ts, m.mine ? me : other);

                  RemoteInput ri = new RemoteInput.Builder("reply_text").setLabel("Reply").build();
                  Intent replyIntent = new Intent(ctx, ReplyReceiver.class).setAction("reply").putExtra("id", id);
                  PendingIntent replyPi = PendingIntent.getBroadcast(ctx, id, replyIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0));
                  NotificationCompat.Action reply = new NotificationCompat.Action.Builder(android.R.drawable.ic_menu_send, "Reply", replyPi)
                      .addRemoteInput(ri)
                      .setSemanticAction(NotificationCompat.Action.SEMANTIC_ACTION_REPLY)
                      .setShowsUserInterface(false).build();
                  Intent delIntent = new Intent(ctx, ReplyReceiver.class).setAction("dismiss").putExtra("id", id);
                  PendingIntent delPi = PendingIntent.getBroadcast(ctx, id + 1, delIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, MSG_CH)
                      .setSmallIcon(smallIcon(ctx))
                      .setColor(ACCENT)
                      .setStyle(style)
                      .setContentTitle(c.title)
                      .setContentText(c.msgs.get(c.msgs.size() - 1).text)
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setOnlyAlertOnce(!alert)
                      .setDefaults(NotificationCompat.DEFAULT_SOUND)
                      .addAction(reply)
                      .setShortcutId(shortcutId)
                      .setContentIntent(open(ctx, id, c.convId, c.title))
                      .setDeleteIntent(delPi);
                  if (c.avatar != null) b.setLargeIcon(c.avatar);
                  ((NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE)).notify(id, b.build());
              }

              static void handleReply(Context ctx, int id, String text) {
                  String convId = "";
                  String title = "";
                  synchronized (Notifier.class) {
                      Conv c = convs.get(id);
                      if (c != null) { convId = c.convId; title = c.title; c.msgs.add(new Msg(text, true)); }
                  }
                  MainActivity a = activity;
                  if (a != null) {
                      a.runJs("(window.__replyQ=window.__replyQ||[]).push({c:" + JSONObject.quote(convId)
                          + ",t:" + JSONObject.quote(text) + ",n:" + JSONObject.quote(title)
                          + "});window.__flushReplies&&window.__flushReplies();");
                  } else if (!sendRemote(ctx, convId, text)) {
                      queue(ctx, convId, text, title);
                  }
                  repost(ctx, id, false);
              }

              // The app is closed: send the reply through the Cloud Function, authenticated by this device's push token.
              private static boolean sendRemote(Context ctx, String convId, String text) {
                  if (convId.isEmpty()) return false;
                  try {
                      return remote(ctx, "replyMessage", new JSONObject().put("convId", convId).put("text", text));
                  } catch (Exception e) {
                      return false;
                  }
              }

              static void remoteDecline(Context ctx, String callId) {
                  try { remote(ctx, "declineCall", new JSONObject().put("callId", callId)); } catch (Exception ignored) { }
              }

              private static boolean remote(Context ctx, String fn, JSONObject body) {
                  if (PUSH_API.isEmpty()) return false;
                  try {
                      body.put("token", ctx.getSharedPreferences("app", Context.MODE_PRIVATE).getString("fcm", ""));
                      HttpURLConnection h = (HttpURLConnection) new URL(PUSH_API + "/" + fn).openConnection();
                      h.setRequestMethod("POST");
                      h.setConnectTimeout(8000);
                      h.setReadTimeout(8000);
                      h.setDoOutput(true);
                      h.setRequestProperty("Content-Type", "application/json");
                      OutputStream o = h.getOutputStream();
                      o.write(body.toString().getBytes("UTF-8"));
                      o.close();
                      int code = h.getResponseCode();
                      h.disconnect();
                      return code >= 200 && code < 300;
                  } catch (Exception e) {
                      return false;
                  }
              }

              static synchronized void forget(int id) { convs.remove(id); }

              static synchronized void clearMessages(Context ctx) {
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.cancel(SECRET_ID);
                  for (Integer id : convs.keySet()) nm.cancel(id);
                  convs.clear();
              }

              static void showCall(final Context ctx, final String name, final String avatarUrl, final String type, final String callId) {
                  if (foreground) return;
                  channels(ctx);
                  new Thread(() -> {
                      Bitmap av = loadAvatar(avatarUrl);
