                      Person.Builder pb = new Person.Builder().setName(nm).setImportant(true);
                      if (av != null) pb.setIcon(IconCompat.createWithBitmap(av));
                      NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, CALL_CH)
                          .setSmallIcon(android.R.drawable.sym_call_incoming)
                          .setColor(ACCENT)
                          .setContentText("video".equals(type) ? "Incoming video call" : "Incoming voice call")
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE))
                          .setOngoing(true)
                          .setTimeoutAfter(45000)
                          .setStyle(NotificationCompat.CallStyle.forIncomingCall(pb.build(), decline, answer))
                          .setFullScreenIntent(screen, true)
                          .setContentIntent(screen);
