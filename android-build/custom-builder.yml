                      Notifier.showActivity(this, d.get("body"), d.get("avatar"));
                  } else if (d.get("body") != null) {
                      Notifier.showMessage(this, d.get("title"), d.get("body"), d.get("avatar"), d.get("convId"));
                  }
              }

              @Override
              public void onNewToken(String token) {
                  Notifier.saveToken(this, token);
              }
          }
          `);
          JS

      - name: Build web/game app (optimized release, automatic retries)
        if: env.WEB == 'true'
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          EXTRA=""
          run_gradle() {
            ./gradlew "$@" $EXTRA --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
            return "${PIPESTATUS[0]}"
          }
          # Reads the failed build log and repairs the usual causes before the next try.
          autofix() {
            L="$RUNNER_TEMP/gradle.log"
            EXTRA="--refresh-dependencies"
            if grep -qE "OutOfMemoryError|Java heap space|GC overhead|Metaspace" "$L"; then
              echo "::warning::Auto-fix: Gradle ran out of memory. Raising the limit."
              sed -i '/^org.gradle.jvmargs/d' gradle.properties
              echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8' >> gradle.properties
            fi
            N="$(grep -oE "compile against version [0-9]+" "$L" | grep -oE "[0-9]+" | sort -n | tail -n 1 || true)"
            CUR="$(grep -oE "compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+" variables.gradle | grep -oE "[0-9]+$" | head -n 1 || true)"
            if [ -n "$N" ] && [ -n "$CUR" ] && [ "$N" -gt "$CUR" ]; then
              echo "::warning::Auto-fix: a library needs compileSdk $N. Updating."
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$N" > /dev/null 2>&1 || true
              sed -i -E "s/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\1$N/" variables.gradle
              echo "android.suppressUnsupportedCompileSdk=$N" >> gradle.properties
            fi
            return 0
          }
          try_build() {
            for i in 1 2 3; do
              if run_gradle "$1"; then return 0; fi
              echo "::warning::Build attempt $i of 3 failed. Applying automatic fixes."
              autofix
              sleep 5
            done
            return 1
          }
          try_build assembleRelease || { echo "::error::The build failed after 3 automatic attempts. Check the Gradle log above."; exit 1; }
          if [ "$BUILD_AAB" = "true" ]; then
            try_build bundleRelease || echo "::warning::The .aab could not be built. The APK is fine."
          fi

      - name: Build Flutter app
        if: env.TYPE == 'flutter'
        run: |
          cd "$SRC_DIR"
          flutter pub get
          flutter build apk --release --build-name "$VERSION_NAME" --build-number "$GITHUB_RUN_NUMBER"

      - name: Build native Android project (Java/Kotlin)
        if: env.TYPE == 'gradle'
        run: |
          cd "$SRC_DIR"
          if [ -f gradlew ]; then chmod +x gradlew; G=./gradlew; else G=gradle; fi
          $G assembleRelease --no-daemon --stacktrace || $G assembleDebug --no-daemon --stacktrace

      - name: Sign and collect APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK="$(find "$ROOT" -path '*outputs*' -name '*.apk' | grep -i release | head -n 1 || true)"
          [ -n "$APK" ] || APK="$(find "$ROOT" -path '*outputs*' -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "::error::No APK was produced"; exit 1; }
          echo "Found: $APK"
          mkdir -p "$RUNNER_TEMP/out"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          KS="$RUNNER_TEMP/app.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            ALIAS="${KS_ALIAS:-app}"; SP="$KS_PASS"; KP="${KS_KEYPASS:-$KS_PASS}"
            echo "Signing with your permanent keystore."
          else
            ALIAS=app; SP=android; KP=android
            keytool -genkeypair -keystore "$KS" -alias app -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=App"
            echo "::warning::No keystore secret found. A temporary key is used, so uninstall the old app before installing this APK."
          fi
          if [[ "$APK" == *unsigned* ]]; then
            "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$SP" --key-pass "pass:$KP" --ks-key-alias "$ALIAS" \
              --out "$RUNNER_TEMP/out/app.apk" "$RUNNER_TEMP/aligned.apk"
          else
            cp "$APK" "$RUNNER_TEMP/out/app.apk"
          fi
          AAB="$(find "$ROOT" -path '*outputs*' -name '*.aab' | grep -i release | head -n 1 || true)"
          if [ -n "$AAB" ]; then
            jarsigner -keystore "$KS" -storepass "$SP" -keypass "$KP" -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar "$RUNNER_TEMP/out/app.aab" "$AAB" "$ALIAS"
          fi
          echo "Certificate fingerprint (use the SHA-256 line in assetlinks.json for deep links):"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/out/app.apk" | grep -i "SHA-256" || true
          # Verified App Links: put this file on the website so https:// links open the app directly.
          if [ -n "$DEEP_HOST" ]; then
            CERT_SHA="$("$BT/apksigner" verify --print-certs "$RUNNER_TEMP/out/app.apk" | sed -n 's/.*SHA-256 digest: //p' | head -n 1)"
            if [ -n "$CERT_SHA" ]; then
              printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":[{"namespace":"android_app","package_name":"%s","sha256_cert_fingerprints":["%s"]}]}]\n' "$PACKAGE_ID" "$CERT_SHA" > "$RUNNER_TEMP/out/assetlinks.json"
              echo "::notice::Deep links ready. Upload assetlinks.json to https://$DEEP_HOST/.well-known/assetlinks.json"
            fi
          fi
          if [ "$WEB" = "true" ]; then
            (cd "$APP_DIR/www" && zip -qr "$RUNNER_TEMP/out/web-bundle.zip" .)
          fi
          ls -la "$RUNNER_TEMP/out"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/out/app.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB and OTA web bundle
        uses: actions/upload-artifact@v4
        with:
          name: extras-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/out/app.aab
            ${{ runner.temp }}/out/web-bundle.zip
            ${{ runner.temp }}/out/assetlinks.json
          if-no-files-found: ignore
          retention-days: 7
