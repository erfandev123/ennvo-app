<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="ritaAvatarTitle">
  <title id="ritaAvatarTitle">Rita Akter — Co-Developer &amp; Partner, Ennvo</title>
  <defs>
    <linearGradient id="ritaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="ritaGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="ritaSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .glow { animation: ritaGlow 4s ease-in-out infinite; }
    .portrait { animation: ritaFloat 6s ease-in-out infinite; }
    @keyframes ritaGlow {
      0%,100% { opacity: 0.45; r: 150; }
      50% { opacity: 0.75; r: 175; }
    }
    @keyframes ritaFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
  <rect width="400" height="400" rx="200" fill="#fdf2f8"/>
  <circle cx="200" cy="200" r="150" fill="url(#ritaGrad)" class="glow"/>
  <circle cx="200" cy="200" r="170" fill="url(#ritaGlow)" class="glow"/>
  <g class="portrait" filter="url(#ritaSoft)">
    <circle cx="200" cy="205" r="92" fill="#ffffff" stroke="rgba(236,72,153,0.35)" stroke-width="4"/>
    <circle cx="200" cy="180" r="52" fill="#fce7f3"/>
    <path d="M128 248 Q200 200 272 248" fill="none" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round"/>
    <path d="M160 292 Q200 272 240 292" fill="none" stroke="#f9a8d4" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="200" y="242" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="104" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-10">RA</text>
</svg>
