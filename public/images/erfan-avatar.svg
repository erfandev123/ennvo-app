<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="erfanAvatarTitle">
  <title id="erfanAvatarTitle">Erfan Sarker — Founder &amp; Software Engineer, Ennvo</title>
  <defs>
    <linearGradient id="erfanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="erfanGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="erfanSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .glow { animation: fanGlow 4s ease-in-out infinite; }
    .portrait { animation: fanFloat 6s ease-in-out infinite; }
    @keyframes fanGlow {
      0%,100% { opacity: 0.45; r: 150; }
      50% { opacity: 0.75; r: 175; }
    }
    @keyframes fanFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
  <rect width="400" height="400" rx="200" fill="#f8fafc"/>
  <circle cx="200" cy="200" r="150" fill="url(#erfanGrad)" class="glow"/>
  <circle cx="200" cy="200" r="170" fill="url(#erfanGlow)" class="glow"/>
  <g class="portrait" filter="url(#erfanSoft)">
    <circle cx="200" cy="205" r="92" fill="#ffffff" stroke="rgba(14,165,233,0.35)" stroke-width="4"/>
    <circle cx="200" cy="180" r="52" fill="#e2e8f0"/>
    <path d="M128 248 Q200 200 272 248" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
    <path d="M160 292 Q200 272 240 292" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="200" y="242" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="104" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-10">ES</text>
</svg>
