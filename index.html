    <!-- Android WebView Hardware Acceleration & Fast Render CSS -->
    <style>
      * {
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      html, body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      .gpu-accelerated {
        transform: translateZ(0);
        will-change: transform, opacity;
      }

      /* Instant branded splash - pure inline CSS, zero network dependencies */
      #ennvo-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #0ea5e9;
        background-image:
          radial-gradient(circle at 50% 26%, #38bdf8 0%, #0ea5e9 44%, #1d4ed8 100%);
        color: #ffffff;
        text-align: center;
        font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      #ennvo-splash::before,
      #ennvo-splash::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.09);
        pointer-events: none;
      }
      #ennvo-splash::before {
        width: 420px;
        height: 420px;
        top: -190px;
        right: -150px;
      }
      #ennvo-splash::after {
        width: 320px;
        height: 320px;
        bottom: -170px;
        left: -130px;
        background: rgba(255, 255, 255, 0.06);
      }
      .ennvo-splash-logo {
        position: relative;
        width: 92px;
        height: 92px;
        padding: 8px;
        border-radius: 26px;
        background: #ffffff;
        box-shadow: 0 20px 55px rgba(24, 8, 64, 0.38);
        animation: ennvo-splash-in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .ennvo-splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 20px;
        display: block;
      }
      .ennvo-splash-name {
        position: relative;
        margin: 22px 0 4px;
        font-size: 34px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.03em;
        animation: ennvo-splash-in 0.55s 0.05s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .ennvo-splash-tagline {
        position: relative;
        margin: 0;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.78);
        animation: ennvo-splash-in 0.55s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .ennvo-splash-dots {
        position: relative;
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 34px;
        animation: ennvo-splash-in 0.55s 0.16s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .ennvo-splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffffff;
        animation: ennvo-splash-pulse 1.15s infinite ease-in-out;
      }
      .ennvo-splash-dots span:nth-child(2) { animation-delay: 0.16s; }
      .ennvo-splash-dots span:nth-child(3) { animation-delay: 0.32s; }
      @keyframes ennvo-splash-in {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes ennvo-splash-pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.78); }
        40% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ennvo-splash-logo,
        .ennvo-splash-name,
        .ennvo-splash-tagline,
        .ennvo-splash-dots,
        .ennvo-splash-dots span { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <!-- Instant branded splash. React replaces it on first render. -->
    <div id="root">
      <div id="ennvo-splash" role="status" aria-label="Ennvo is loading">
        <div class="ennvo-splash-logo">
          <img src="/icon-96.png" alt="Ennvo" width="76" height="76" fetchpriority="high" />
        </div>
        <h1 class="ennvo-splash-name">Ennvo</h1>
        <p class="ennvo-splash-tagline">Connect · Share · Go live</p>
        <div class="ennvo-splash-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- No-Script Fallback for JavaScript-Disabled Browsers & Search Bots -->
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif; background-color: #f8fafc; color: #334155;">
        <h2>JavaScript Required for Interactive Features</h2>
        <p>Ennvo offers real-time HD audio/video calls, short reels, and instant messaging. Please enable JavaScript to access all interactive features on <a href="https://ennvo.vercel.app/">https://ennvo.vercel.app/</a>.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
