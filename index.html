    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ========================================================================= -->
    <!-- PRIMARY TECHNICAL SEO METADATA                                            -->

    <link rel="canonical" href="https://ennvo.vercel.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts load without blocking the first paint (critical on slow networks) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"

    />

    <!-- Android WebView Hardware Acceleration & Fast Render CSS -->
    <style>
      * {
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      html, body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      .gpu-accelerated {
        transform: translateZ(0);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- No-Script Fallback for JavaScript-Disabled Browsers & Search Bots -->
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif; background-color: #f8fafc; color: #334155;">
        <h2>JavaScript Required for Interactive Features</h2>
        <p>Ennvo offers real-time HD audio/video calls, short reels, and instant messaging. Please enable JavaScript to access all interactive features on <a href="https://ennvo.vercel.app/">https://ennvo.vercel.app/</a>.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>

</html>
