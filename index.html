<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <meta property="og:type" content="website" />

    <meta property="og:image" content="/Ennvo.png" />
    <meta property="og:site_name" content="Ennvo" />

    <!-- Preconnect & DNS Prefetch for Fast Mobile Loading -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="preload" as="image" href="/chat-background.png" fetchpriority="high" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/Ennvo.png" />

    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Android WebView Hardware Acceleration & Fast Render CSS -->
    <style>
      * {
        -webkit-tap-highlight-color: transparent !important;
        touch-action: manipulation;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      .gpu-accelerated {
        transform: translateZ(0);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <!-- Immediate Native-Style Splash & Loading Screen for Ultra-Fast First Paint -->
    <div id="ennvo-initial-loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background-color:#0b0813;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.35s ease,visibility 0.35s ease;-webkit-user-select:none;user-select:none;">
      <div style="display:flex;flex-direction:column;align-items:center;animation:ennvoPulse 1.8s infinite ease-in-out;">
        <img src="/Ennvo.png" alt="Ennvo" style="width:84px;height:84px;object-fit:contain;border-radius:22px;box-shadow:0 12px 30px rgba(124,58,237,0.35);" />
        <h1 style="color:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:800;letter-spacing:0.5px;margin:18px 0 6px 0;">Ennvo</h1>
        <p style="color:#a78bfa;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;font-size:12px;font-weight:500;margin:0;letter-spacing:0.3px;">Fast Social Media & Calls</p>
      </div>
      <!-- Sleek Loading Spinner Bar -->
      <div style="width:140px;height:3.5px;background:rgba(255,255,255,0.12);border-radius:99px;margin-top:36px;overflow:hidden;position:relative;">
        <div style="position:absolute;top:0;left:0;height:100%;width:45%;background:linear-gradient(90deg,#7c3aed,#ec4899);border-radius:99px;animation:ennvoBar 1.2s infinite ease-in-out;"></div>
      </div>
    </div>
    <style>
      @keyframes ennvoPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes ennvoBar {
        0% { left: -45%; width: 45%; }
        50% { width: 65%; }
        100% { left: 100%; width: 45%; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
