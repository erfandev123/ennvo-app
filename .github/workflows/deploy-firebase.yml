name: Deploy Firebase (push + rules)

# One click: sends real push notifications (like WhatsApp) and publishes the
# security rules. Needs ONE repository secret:
#   FIREBASE_SERVICE_ACCOUNT = the service account JSON from
#   Firebase console -> Project settings -> Service accounts -> Generate new private key
on:
  workflow_dispatch:
    inputs:
      also_rules:
        description: 'Also publish Firestore + Realtime Database rules'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret first (Firebase console -> Project settings -> Service accounts -> Generate new private key)."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json','utf8')); console.log('service account json is valid')"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Install function dependencies
        run: |
          test -f firebase.json || { echo "::error::firebase.json is missing from the repository root"; exit 1; }
          cd functions
          npm install --no-audit --no-fund
          npm run build

      - name: Deploy Cloud Functions (real-time push for messages and calls)
        run: |
          npx --yes firebase-tools@13 --version
          npx --yes firebase-tools@13 deploy --only functions --project ennvo-6c01c --non-interactive --force

      - name: Deploy security rules
        if: ${{ inputs.also_rules }}
        run: |
          npx --yes firebase-tools@13 deploy --only firestore:rules,database --project ennvo-6c01c --non-interactive --force
