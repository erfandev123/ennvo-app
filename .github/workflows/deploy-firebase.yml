name: Deploy Firebase (push + rules)

# One click: sends real push notifications (like WhatsApp) and publishes the
# security rules. Needs ONE repository secret:
#   FIREBASE_SERVICE_ACCOUNT = the service account JSON from
#   Firebase console -> Project settings -> Service accounts -> Generate new private key
on:
  workflow_dispatch:
    inputs:
      also_rules:
        description: 'Also publish Firestore + Realtime Database rules'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret first (Firebase console -> Project settings -> Service accounts -> Generate new private key)."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e "
            const sa = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json','utf8'));
            console.log('service account :', sa.client_email);
            console.log('project         :', sa.project_id);
            console.log('::notice::Deploying as ' + sa.client_email + ' on ' + sa.project_id);
          "
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Install function dependencies
        run: |
          test -f firebase.json || { echo "::error::firebase.json is missing from the repository root"; exit 1; }
          cd functions
          npm install --no-audit --no-fund
          npm run build

      - name: Deploy Cloud Functions (real-time push for messages and calls)
        id: deploy_functions
        continue-on-error: true
        run: |
          npx --yes firebase-tools@13 --version
          npx --yes firebase-tools@13 deploy --only functions --project ennvo-6c01c --non-interactive --force 2>&1 | tee /tmp/deploy.log

      - name: Explain a permission failure
        if: steps.deploy_functions.outcome == 'failure'
        run: |
          SA_EMAIL=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')).client_email)")
          if grep -q "Permission denied to get service" /tmp/deploy.log; then
            echo "::error::The service account $SA_EMAIL cannot read/enable Google Cloud APIs. It needs the 'Editor' role (or the four roles listed below) on project ennvo-6c01c."
            echo ""
            echo "Fix it once, in this order:"
            echo " 1) Open https://console.cloud.google.com/iam-admin/iam?project=ennvo-6c01c"
            echo " 2) Find $SA_EMAIL and press the pencil (Edit principal)"
            echo " 3) Add role: Editor   (or: Service Usage Consumer + Cloud Functions Admin +") 
            echo "                       Service Account User + Cloud Build Editor + Artifact Registry Admin)"
            echo " 4) Save, then run this workflow again."
            echo ""
            echo "One-line option with gcloud (if you have gcloud locally):"
            echo " gcloud projects add-iam-policy-binding ennvo-6c01c \\"
            echo "   --member=\"serviceAccount:$SA_EMAIL\" --role=roles/editor"
          elif grep -q "Blaze" /tmp/deploy.log; then
            echo "::warning::Cloud Functions need the Blaze (pay-as-you-go) plan. This is OPTIONAL: the push gateway at /api/push on Vercel already sends the notifications, so you can ignore this."
            tail -6 /tmp/deploy.log
          else
            echo "::warning::Firebase functions deploy failed. The Vercel push gateway is unaffected."
            tail -20 /tmp/deploy.log
          fi

      - name: Deploy security rules
        if: ${{ inputs.also_rules }}
        continue-on-error: true
        run: |
          npx --yes firebase-tools@13 deploy --only firestore:rules,database --project ennvo-6c01c --non-interactive --force || {
            echo "::warning::Rules were not published (the service account needs the 'Firebase Rules Admin' role). Nothing else is affected."
          }
