name: Build Android APK (Ennvo 1.9.0)

# Builds the real, committed android/ Capacitor project (never regenerates it),
# so every native fix in android/app/src is part of the APK. The web app and the
# lightweight call bundle are built first, then `cap sync` copies them into the
# Android assets.
#
# Optional repository secrets:
#   GOOGLE_SERVICES_JSON        google-services.json (raw JSON) for FCM push
#   GOOGLE_SERVICES_JSON_BASE64 same file, base64 encoded (takes priority)
#   KEYSTORE_BASE64             permanent release keystore (.jks) base64
#   KEYSTORE_PASSWORD           keystore password
#   KEY_ALIAS                   key alias (default: ennvo)
#   KEY_PASSWORD                key password (default: KEYSTORE_PASSWORD)
#
# A matching google-services.json is committed in android/app/, so FCM push
# works out of the box; the secrets above only override it.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v1.9.0

permissions:
  contents: write

concurrency:
  group: android-apk-v1.9.0
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign and release Ennvo-1.9.0.apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app + lightweight call bundle
        run: npm run build

      - name: Add Firebase config (optional)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
            echo "::notice::Using GOOGLE_SERVICES_JSON_BASE64."
          elif [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > android/app/google-services.json
            echo "::notice::Using GOOGLE_SERVICES_JSON."
          else
            echo "::warning::No Firebase secret. The APK builds and runs, but FCM push notifications stay disabled."
          fi
          node -e "
            const fs=require('fs');
            const p='android/app/google-services.json';
            if (!fs.existsSync(p)) {
              console.log('::warning::No google-services.json - FCM push stays disabled.');
              process.exit(0);
            }
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            const pk=(j.client||[]).map(c=>c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name).filter(Boolean);
            console.log('Firebase project:', j.project_info && j.project_info.project_id, '| packages:', pk.join(', ') || 'none');
            const appId=(fs.readFileSync('android/app/build.gradle','utf8').match(/applicationId\s+\"([^\"]+)\"/)||[])[1];
            if (pk.length && !pk.includes(appId)) {
              console.error('::error::google-services.json is for ['+pk.join(', ')+'] but the APK uses '+appId+'.');
              process.exit(1);
            }
            console.log('google-services.json matches ' + appId);
          "

      - name: Sync Capacitor assets and plugins
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign and collect APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "::error::No release APK was produced"; exit 1; }
          echo "Found: $APK"

          mkdir -p "$RUNNER_TEMP/out"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          KS="$RUNNER_TEMP/ennvo-release.jks"

          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            ALIAS="${KS_ALIAS:-ennvo}"
            SP="$KS_PASS"
            KP="${KS_KEYPASS:-$KS_PASS}"
            echo "::notice::Signing with the permanent release keystore."
          else
            ALIAS=ennvo
            SP=ennvo-release
            KP=ennvo-release
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$SP" -keypass "$KP" \
              -dname "CN=Ennvo, OU=Mobile, O=Ennvo, L=Internet, C=US"
            echo "::warning::No KEYSTORE_BASE64 secret. Signed with a temporary key, so uninstall the previous Ennvo before installing this APK."
          fi

          if [[ "$APK" == *unsigned* ]]; then
            "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$SP" --key-pass "pass:$KP" \
              --out "$RUNNER_TEMP/out/Ennvo-1.9.0.apk" \
              "$RUNNER_TEMP/aligned.apk"
          else
            cp "$APK" "$RUNNER_TEMP/out/Ennvo-1.9.0.apk"
          fi

          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/out/Ennvo-1.9.0.apk" | grep -i "SHA-256" || true
          ls -lh "$RUNNER_TEMP/out"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ennvo-1.9.0
          path: ${{ runner.temp }}/out/Ennvo-1.9.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release v1.9.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0
          name: Ennvo 1.9.0
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/out/Ennvo-1.9.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
